<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MP1 Classwork</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, Helvetica, sans-serif;
      background: white;
      color: #000;
    }

    .calendar-wrapper {
      max-width: 1280px;
      margin: auto;
    }

    .page-title {
      font-size: 38px;
      font-weight: 300;
      color: #555;
      margin: 0 0 32px 0;
    }

    /* =========================
       HEADER
    ========================== */

    .hero {
      background: #2f5d78;
      min-height: 242px;
      display: grid;
      grid-template-columns: 180px 1fr 180px;
      align-items: center;
      padding: 16px 36px;
      margin: 0 14px 60px 14px;
    }

    .back-button {
      font-size: 74px;
      color: #ff6980;
      text-decoration: none;
      text-align: center;
    }

    .hero-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }

    .engine-icon {
      font-size: 65px;
    }

    .hero-title {
      font-size: 58px;
      font-weight: 700;
      color: white;
      margin: 0;
      text-shadow:
        -2px -2px 0 #1d4660,
         2px -2px 0 #1d4660,
        -2px  2px 0 #1d4660,
         2px  2px 0 #1d4660;
    }

    .safe-area {
      text-align: center;
      color: white;
      font-weight: bold;
    }

    .safe-hand {
      font-size: 70px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .safe-text {
      font-size: 18px;
      text-decoration: underline;
    }

    /* =========================
       CALENDAR
    ========================== */

    .calendar {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1px solid #333;
    }

    .calendar th,
    .calendar td {
      border: 1px solid #333;
      text-align: center;
    }

    .calendar th {
      background: #fff0b7;
      font-size: 18px;
      padding: 10px 6px;
      height: 44px;
    }

    .week-column {
      width: 125px;
    }

    .week-row td {
      height: 170px;
      font-size: 20px;
      font-weight: bold;
      padding: 10px;
    }

    .week-blue td {
      background: #b9d8ed;
    }

    .week-green td {
      background: #b9e8ce;
    }

    .separator td {
      height: 18px;
      background: #fff0b7;
      padding: 0;
    }

    .date {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .calendar-button {
      border: none;
      background: transparent;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
    }

    .calendar-button:hover {
      background: rgba(255,255,255,.4);
    }

    .closed {
      color: #ff0066;
      font-size: 17px;
      line-height: 1.6;
      font-weight: 700;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 20px;
    }

    /* =========================
       POPUP
    ========================== */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 24px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: min(760px, 95vw);
      max-height: 85vh;
      overflow-y: auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      position: relative;
      padding: 32px;
      text-align: left;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: none;
      background: none;
      font-size: 34px;
      cursor: pointer;
    }

    .modal h2 {
      margin-top: 0;
      padding-right: 40px;
      color: #2f5d78;
    }

    .modal-content {
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @media (max-width: 850px) {

      .hero {
        grid-template-columns: 70px 1fr 70px;
        padding: 12px;
      }

      .hero-title {
        font-size: 34px;
      }

      .engine-icon {
        font-size: 38px;
      }

      .week-row td {
        height: 125px;
        font-size: 15px;
      }

      .date {
        font-size: 16px;
      }
    }

  </style>
</head>

<body>

<div class="calendar-wrapper">

  <h1 class="page-title">MP1 Classwork</h1>

  <div class="hero">

    <a href="#" class="back-button">↩</a>

    <div class="hero-center">
      <div class="engine-icon">⚙️</div>
      <h2 class="hero-title">MP1 Classwork</h2>
    </div>

    <div class="safe-area">
      <div class="safe-hand">✌️</div>
      <div class="safe-text">SAFE 2 SAY ➡</div>
    </div>

  </div>


  <div id="calendarArea">

    <div class="loading">
      Loading calendar...
    </div>

  </div>

</div>


<!-- POPUP -->

<div
  id="modalOverlay"
  class="modal-overlay"
  onclick="closeModalFromOverlay(event)"
>

  <div class="modal">

    <button
      class="modal-close"
      onclick="closeModal()"
    >
      ×
    </button>

    <h2 id="modalTitle"></h2>

    <div
      id="modalContent"
      class="modal-content"
    ></div>

  </div>

</div>


<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQRZ071dUf8OcCEjIQe8g5dMWafYYBolUTy2Y-IPP8uyGZPJn_rjgkBjrjSTNXH0CmAeMSgd_5z23hy/pub?output=csv";


const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday"
];


Papa.parse(SHEET_URL, {

  download: true,

  header: true,

  skipEmptyLines: true,

  complete: function(results) {

    buildCalendar(results.data);

  },

  error: function(error) {

    document.getElementById("calendarArea").innerHTML =
      "<div class='loading'>Unable to load calendar.</div>";

    console.error(error);
  }

});


function buildCalendar(data) {

  const weeks = {};


  data.forEach(row => {

    const week = String(row["Week"] || "").trim();

    const day = String(row["Day"] || "").trim();


    if (!week || !day) return;


    if (!weeks[week]) {

      weeks[week] = {};

    }


    weeks[week][day] = row;

  });


  let html = `

    <table class="calendar">

      <thead>

        <tr>

          <th class="week-column">
            Week #
          </th>

          <th>Monday</th>

          <th>Tuesday</th>

          <th>Wednesday</th>

          <th>Thursday</th>

          <th>Friday</th>

        </tr>

      </thead>

      <tbody>

  `;


  const weekNumbers =
    Object.keys(weeks).sort((a,b) => Number(a) - Number(b));


  weekNumbers.forEach((weekNumber, index) => {

    const colorClass =
      index % 2 === 0
      ? "week-blue"
      : "week-green";


    html += `

      <tr class="week-row ${colorClass}">

        <td>
          Week ${escapeHTML(weekNumber)}
        </td>

    `;


    DAYS.forEach(day => {

      const item = weeks[weekNumber][day];


      if (!item) {

        html += "<td></td>";

        return;

      }


      const date =
        String(item["Date"] || "").trim();

      const buttonText =
        String(item["Button Text"] || "").trim();

      const popupTitle =
        String(item["Popup Title"] || date).trim();

      const popupContent =
        String(item["Popup Content"] || "").trim();

      const status =
        String(item["Status"] || "Normal")
          .trim()
          .toLowerCase();


      if (status === "closed") {

        html += `

          <td>

            <div class="date">
              ${escapeHTML(date)}
            </div>

            <div class="closed">
              ${escapeHTML(popupContent)}
            </div>

          </td>

        `;

      }

      else if (buttonText || popupContent) {

        html += `

          <td>

            <button
              class="calendar-button"
              onclick="openModal(
                '${escapeJS(popupTitle)}',
                '${escapeJS(popupContent)}'
              )"
            >

              <div class="date">
                ${escapeHTML(date)}
              </div>

              ${escapeHTML(buttonText)}

            </button>

          </td>

        `;

      }

      else {

        html += `

          <td>

            <div class="date">
              ${escapeHTML(date)}
            </div>

          </td>

        `;

      }

    });


    html += "</tr>";


    if (index < weekNumbers.length - 1) {

      html += `

        <tr class="separator">

          <td colspan="6"></td>

        </tr>

      `;

    }

  });


  html += `

      </tbody>

    </table>

  `;


  document.getElementById("calendarArea").innerHTML = html;

}



function openModal(title, content) {

  document.getElementById("modalTitle").textContent = title;

  document.getElementById("modalContent").textContent = content;

  document
    .getElementById("modalOverlay")
    .classList.add("open");

  document.body.style.overflow = "hidden";

}



function closeModal() {

  document
    .getElementById("modalOverlay")
    .classList.remove("open");

  document.body.style.overflow = "";

}



function closeModalFromOverlay(event) {

  if (event.target.id === "modalOverlay") {

    closeModal();

  }

}



document.addEventListener("keydown", event => {

  if (event.key === "Escape") {

    closeModal();

  }

});



function escapeHTML(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}



function escapeJS(value) {

  return String(value)

    .replaceAll("\\", "\\\\")

    .replaceAll("'", "\\'")

    .replaceAll("\n", "\\n")

    .replaceAll("\r", "");

}

</script>

</body>
</html>
