<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop Schedule</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #073b68;
      --navy-dark: #052a4a;
      --blue: #0c5fa8;
      --yellow: #ffc72c;
      --yellow-light: #ffe28a;
      --silver: #dbe2e8;
      --blue-row: #b9dcf4;
      --green-row: #c3efd3;
      --danger: #e32222;
      --text: #102235;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .site-shell {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px;
    }

    /* =========================================================
       HEADER
    ========================================================== */

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 260px;
      border-radius: 18px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.03),
          rgba(255,255,255,0)
        ),
        linear-gradient(
          135deg,
          var(--navy-dark),
          var(--blue)
        );

      border: 3px solid #c7d2dc;
      box-shadow:
        0 8px 20px rgba(0,0,0,.22),
        inset 0 0 0 2px rgba(255,255,255,.18);

      display: grid;
      grid-template-columns: 320px 1fr;
      align-items: center;
      gap: 35px;

      padding: 25px 40px;
      margin-bottom: 22px;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 28px;
      background: var(--yellow);
      transform: rotate(35deg);
      opacity: .95;
      z-index: 0;
    }

    .hero::before {
      top: 15px;
      right: -100px;
    }

    .hero::after {
      bottom: 5px;
      left: -150px;
    }

    .hero-logo-wrap,
    .hero-title-wrap {
      position: relative;
      z-index: 2;
    }

    .hero-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-logo {
      width: 260px;
      max-height: 220px;
      object-fit: contain;
      display: block;

      /*
        This does not remove a baked-in white PNG background,
        but it makes a transparent version look perfect.
      */
      filter: drop-shadow(0 10px 15px rgba(0,0,0,.28));
    }

    .hero-title-wrap {
      text-align: center;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(54px, 7vw, 100px);
      line-height: .9;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;

      color: white;

      text-shadow:
        -3px -3px 0 #071f34,
         3px -3px 0 #071f34,
        -3px  3px 0 #071f34,
         3px  3px 0 #071f34,
         0 8px 0 rgba(0,0,0,.20);
    }

    .hero-subtitle {
      margin-top: 10px;
      color: var(--yellow);
      font-size: clamp(24px, 3vw, 44px);
      font-weight: 800;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 1px;
    }

    /* =========================================================
       CALENDAR
    ========================================================== */

    .calendar-shell {
      background: white;
      border-radius: 14px;
      overflow: hidden;

      border: 1px solid #94a3b3;

      box-shadow:
        0 6px 18px rgba(0,0,0,.12);
    }

    .calendar {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .calendar th,
    .calendar td {
      border: 1px solid #526273;
      text-align: center;
    }

    .calendar thead th {
      background:
        linear-gradient(
          to bottom,
          #ffe35e,
          #ffc928
        );

      color: #111;
      font-size: 22px;
      font-weight: 900;
      padding: 14px 8px;

      text-shadow:
        0 1px 0 rgba(255,255,255,.5);
    }

    .week-column {
      width: 145px;
    }

    .week-row td {
      height: 180px;
      padding: 14px;
      vertical-align: middle;
    }

    .week-blue td {
      background:
        linear-gradient(
          to bottom,
          #c7e8fb,
          var(--blue-row)
        );
    }

    .week-green td {
      background:
        linear-gradient(
          to bottom,
          #d2f5df,
          var(--green-row)
        );
    }

    .week-label {
      font-size: 25px;
      font-weight: 900;
      line-height: 1.1;
    }

    .date {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 14px;
      color: #071c2e;
    }

    /* =========================================================
       ACTIVITY BUTTONS
    ========================================================== */

    .activity-button {
      width: 90%;
      max-width: 250px;

      margin: 0 auto;

      border: none;
      border-radius: 12px;

      padding: 16px 15px;

      background:
        linear-gradient(
          to bottom,
          #0a4d88,
          #053765
        );

      color: white;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 5px 0 #022541,
        0 8px 14px rgba(0,0,0,.22);

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .activity-button:hover {
      transform: translateY(-2px);

      background:
        linear-gradient(
          to bottom,
          #1170bd,
          #064778
        );

      box-shadow:
        0 7px 0 #022541,
        0 10px 18px rgba(0,0,0,.24);
    }

    .activity-button:active {
      transform: translateY(3px);

      box-shadow:
        0 2px 0 #022541,
        0 5px 10px rgba(0,0,0,.20);
    }

    .button-icon {
      font-size: 25px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .button-label {
      line-height: 1.2;
    }

    /* =========================================================
       CLOSED DAY
    ========================================================== */

    .closed-card {
      width: 88%;
      max-width: 240px;
      margin: 0 auto;

      background: white;

      border-radius: 12px;

      padding: 8px;

      box-shadow:
        0 5px 14px rgba(0,0,0,.18);
    }

    .closed-title {
      background: var(--danger);
      color: white;

      border-radius: 7px 7px 0 0;

      font-size: 25px;
      font-weight: 900;

      padding: 7px;
    }

    .closed-text {
      color: var(--danger);

      font-size: 18px;
      font-weight: 800;
      font-style: italic;

      padding: 11px 7px;
      white-space: pre-wrap;
    }

    /* =========================================================
       MODAL
    ========================================================== */

    .modal-overlay {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.68);

      z-index: 999999;

      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: min(780px, 96vw);
      max-height: 88vh;

      overflow: hidden;

      border-radius: 18px;

      background: white;

      border: 3px solid #ced7df;

      box-shadow:
        0 20px 60px rgba(0,0,0,.48);

      animation: popupIn .18s ease-out;
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      background:
        linear-gradient(
          135deg,
          #05335c,
          #0b5798
        );

      color: white;

      padding: 22px 60px 22px 26px;

      position: relative;

      border-bottom: 5px solid var(--yellow);
    }

    .modal-title {
      margin: 0;

      font-size: 30px;
      font-weight: 900;

      line-height: 1.15;
    }

    .modal-date {
      margin-top: 5px;

      color: var(--yellow);

      font-size: 21px;
      font-weight: 800;
    }

    .modal-close {
      position: absolute;

      right: 18px;
      top: 13px;

      border: none;
      background: transparent;

      color: white;

      font-size: 38px;
      font-weight: 700;

      cursor: pointer;
    }

    .modal-body {
      padding: 26px;

      overflow-y: auto;
      max-height: calc(88vh - 130px);
    }

    .modal-section {
      margin-bottom: 24px;
    }

    .modal-section:last-child {
      margin-bottom: 0;
    }

    .modal-section-title {
      color: var(--navy);

      font-size: 21px;
      font-weight: 900;

      margin-bottom: 9px;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-section-content {
      font-size: 18px;
      line-height: 1.55;

      white-space: pre-wrap;

      color: #1c2c3a;
    }

    .modal-divider {
      height: 1px;
      background: #d3d9df;
      margin: 20px 0;
    }

    .loading {
      padding: 50px;
      text-align: center;

      font-size: 22px;
      font-weight: 700;
    }

    /* =========================================================
       MOBILE
    ========================================================== */

    @media (max-width: 950px) {

      .site-shell {
        padding: 8px;
      }

      .hero {
        grid-template-columns: 180px 1fr;
        min-height: 190px;

        padding: 18px 20px;

        border-radius: 12px;
      }

      .hero-logo {
        width: 165px;
        max-height: 160px;
      }

      .hero-title {
        font-size: clamp(36px, 8vw, 65px);
      }

      .hero-subtitle {
        font-size: 20px;
      }

      .calendar {
        min-width: 900px;
      }

      .calendar-shell {
        overflow-x: auto;
      }

    }

  </style>
</head>


<body>

<div class="site-shell">

  <!-- =======================================================
       HEADER
  ======================================================== -->

  <header class="hero">

    <div class="hero-logo-wrap">

      <img
        src="RMCTC ATT LOGO.png"
        alt="RMCTC Auto Tech"
        class="hero-logo"
      >

    </div>


    <div class="hero-title-wrap">

      <h1 class="hero-title">
        Shop
      </h1>

      <div class="hero-subtitle">
        Schedule
      </div>

    </div>

  </header>


  <!-- =======================================================
       CALENDAR
  ======================================================== -->

  <div class="calendar-shell">

    <div id="calendarArea">

      <div class="loading">
        Loading shop schedule...
      </div>

    </div>

  </div>

</div>


<!-- =========================================================
     POPUP
========================================================== -->

<div
  id="modalOverlay"
  class="modal-overlay"
>

  <div class="modal">

    <div class="modal-header">

      <button
        id="modalClose"
        class="modal-close"
        aria-label="Close popup"
      >
        ×
      </button>

      <h2
        id="modalTitle"
        class="modal-title"
      ></h2>

      <div
        id="modalDate"
        class="modal-date"
      ></div>

    </div>


    <div class="modal-body">

      <div
        id="mainContentSection"
        class="modal-section"
      >

        <div class="modal-section-title">
          🔧 Today's Activity
        </div>

        <div
          id="modalContent"
          class="modal-section-content"
        ></div>

      </div>


      <div
        id="objectivesSection"
        class="modal-section"
        style="display:none;"
      >

        <div class="modal-divider"></div>

        <div class="modal-section-title">
          ✅ Today's Objectives
        </div>

        <div
          id="modalObjectives"
          class="modal-section-content"
        ></div>

      </div>


      <div
        id="materialsSection"
        class="modal-section"
        style="display:none;"
      >

        <div class="modal-divider"></div>

        <div class="modal-section-title">
          🧰 Materials / Tools
        </div>

        <div
          id="modalMaterials"
          class="modal-section-content"
        ></div>

      </div>


      <div
        id="instructionsSection"
        class="modal-section"
        style="display:none;"
      >

        <div class="modal-divider"></div>

        <div class="modal-section-title">
          📋 Instructions
        </div>

        <div
          id="modalInstructions"
          class="modal-section-content"
        ></div>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE SHEET
========================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQRZ071dUf8OcCEjIQe8g5dMWafYYBolUTy2Y-IPP8uyGZPJn_rjgkBjrjSTNXH0CmAeMSgd_5z23hy/pub?output=csv";


const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday"
];


/* =========================================================
   LOAD DATA
========================================================== */

Papa.parse(SHEET_URL, {

  download: true,

  header: true,

  skipEmptyLines: true,


  complete: function(results) {

    buildCalendar(results.data);

  },


  error: function(error) {

    document.getElementById("calendarArea").innerHTML =
      "<div class='loading'>Unable to load schedule.</div>";

    console.error(error);

  }

});


/* =========================================================
   BUILD CALENDAR
========================================================== */

function buildCalendar(data) {

  const weeks = {};

  const popupData = {};


  data.forEach(row => {

    const week =
      String(row["Week"] || "").trim();

    const day =
      String(row["Day"] || "").trim();


    if (!week || !day) {
      return;
    }


    if (!weeks[week]) {
      weeks[week] = {};
    }


    weeks[week][day] = row;

  });


  const weekNumbers =
    Object.keys(weeks)
      .sort((a,b) => Number(a) - Number(b));


  let html = `

    <table class="calendar">

      <thead>

        <tr>

          <th class="week-column">
            Week #
          </th>

          <th>
            Monday
          </th>

          <th>
            Tuesday
          </th>

          <th>
            Wednesday
          </th>

          <th>
            Thursday
          </th>

          <th>
            Friday
          </th>

        </tr>

      </thead>

      <tbody>

  `;


  weekNumbers.forEach((weekNumber, index) => {

    const colorClass =
      index % 2 === 0
        ? "week-blue"
        : "week-green";


    html += `

      <tr class="week-row ${colorClass}">

        <td>

          <div class="week-label">
            Week ${escapeHTML(weekNumber)}
          </div>

        </td>

    `;


    DAYS.forEach(day => {

      const item =
        weeks[weekNumber][day];


      if (!item) {

        html += "<td></td>";

        return;

      }


      const date =
        String(item["Date"] || "").trim();


      const buttonText =
        String(item["Button Text"] || "").trim();


      const popupTitle =
        String(
          item["Popup Title"] ||
          buttonText ||
          date
        ).trim();


      const popupContent =
        String(item["Popup Content"] || "").trim();


      /*
        Optional future Sheet columns.
        These can be blank for now.
      */

      const objectives =
        String(item["Objectives"] || "").trim();


      const materials =
        String(item["Materials"] || "").trim();


      const instructions =
        String(item["Instructions"] || "").trim();


      const status =
        String(item["Status"] || "Normal")
          .trim()
          .toLowerCase();


      /* CLOSED DAY */

      if (status === "closed") {

        html += `

          <td>

            <div class="date">
              ${escapeHTML(date)}
            </div>


            <div class="closed-card">

              <div class="closed-title">
                CLOSED
              </div>

              <div class="closed-text">
                ${escapeHTML(
                  popupContent || buttonText || "No School"
                )}
              </div>

            </div>

          </td>

        `;

        return;

      }


      /* NORMAL ACTIVITY */

      if (
        buttonText ||
        popupContent ||
        objectives ||
        materials ||
        instructions
      ) {

        const popupId =
          `popup-${weekNumber}-${day}`
            .replace(/\s+/g, "-")
            .toLowerCase();


        popupData[popupId] = {

          title: popupTitle,

          date: date,

          content: popupContent,

          objectives: objectives,

          materials: materials,

          instructions: instructions

        };


        html += `

          <td>

            <div class="date">
              ${escapeHTML(date)}
            </div>


            <button
              class="activity-button popup-trigger"
              data-popup-id="${escapeHTML(popupId)}"
            >

              <span class="button-icon">
                🔧
              </span>

              <span class="button-label">
                ${escapeHTML(buttonText || "View Activity")}
              </span>

            </button>

          </td>

        `;

      }


      /* DATE ONLY */

      else {

        html += `

          <td>

            <div class="date">
              ${escapeHTML(date)}
            </div>

          </td>

        `;

      }

    });


    html += "</tr>";

  });


  html += `

      </tbody>

    </table>

  `;


  document.getElementById("calendarArea").innerHTML =
    html;


  /* ATTACH POPUP BUTTON EVENTS */

  document
    .querySelectorAll(".popup-trigger")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const popup =
            popupData[this.dataset.popupId];


          if (popup) {

            openModal(popup);

          }

        }
      );

    });

}


/* =========================================================
   POPUP
========================================================== */

function openModal(data) {

  document.getElementById("modalTitle").textContent =
    data.title || "Shop Activity";


  document.getElementById("modalDate").textContent =
    data.date || "";


  setSection(
    "mainContentSection",
    "modalContent",
    data.content
  );


  setSection(
    "objectivesSection",
    "modalObjectives",
    data.objectives
  );


  setSection(
    "materialsSection",
    "modalMaterials",
    data.materials
  );


  setSection(
    "instructionsSection",
    "modalInstructions",
    data.instructions
  );


  document
    .getElementById("modalOverlay")
    .classList.add("open");


  document.body.style.overflow =
    "hidden";

}


function closeModal() {

  document
    .getElementById("modalOverlay")
    .classList.remove("open");


  document.body.style.overflow =
    "";

}


function setSection(
  sectionId,
  contentId,
  value
) {

  const section =
    document.getElementById(sectionId);

  const content =
    document.getElementById(contentId);


  if (value && value.trim()) {

    section.style.display =
      "block";

    content.textContent =
      value;

  }

  else {

    section.style.display =
      "none";

    content.textContent =
      "";

  }

}


/* CLOSE BUTTON */

document
  .getElementById("modalClose")
  .addEventListener(
    "click",
    closeModal
  );


/* CLICK OUTSIDE POPUP */

document
  .getElementById("modalOverlay")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target.id ===
        "modalOverlay"
      ) {

        closeModal();

      }

    }
  );


/* ESCAPE KEY */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      closeModal();

    }

  }
);


/* =========================================================
   SECURITY / TEXT SAFETY
========================================================== */

function escapeHTML(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
