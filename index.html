<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shop Schedule</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      width: 100%;
      min-height: 100%;
      background: #f3f5f7;
    }


    body {
      margin: 0;

      width: 100%;
      min-height: 100vh;

      background: #f3f5f7;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #0a1e31;
    }



    /* =========================================================
       ENTIRE SITE
    ========================================================== */

    .page-frame {
      width:
        min(
          1000px,
          calc(100vw - 40px)
        );

      margin:
        20px auto 40px auto;
    }



    /* =========================================================
       HEADER
    ========================================================== */

    .shop-header {
      width: 100%;

      margin:
        0 0 8px 0;
    }


    .shop-header img {
      display: block;

      width: 100%;
      max-width: none;

      height: auto;

      margin:
        0 auto;

      border-radius: 14px;

      box-shadow:
        0 5px 14px
        rgba(0,0,0,.22);
    }



    /* =========================================================
       CALENDAR WRAPPER
    ========================================================== */

    .calendar-shell {
      width: 100%;

      background: white;

      border:
        2px solid #6e8194;

      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        0 5px 14px
        rgba(0,0,0,.13);
    }



    /* =========================================================
       CALENDAR
    ========================================================== */

    .calendar {
      width: 100%;

      border-collapse: collapse;

      table-layout: fixed;
    }


    .calendar th,
    .calendar td {
      border:
        1px solid #3c5063;

      text-align: center;
    }



    .calendar thead th {
      background:
        linear-gradient(
          to bottom,
          #ffe467,
          #ffc72c
        );

      color: #111;

      font-size: 18px;
      font-weight: 900;

      padding:
        11px 5px;
    }


    .week-column {
      width: 105px;
    }



    .week-row td {
      height: 140px;

      padding: 8px;

      vertical-align: middle;

      position: relative;

      transition:
        background .2s ease,
        box-shadow .2s ease;
    }


    .week-blue td {
      background:
        linear-gradient(
          to bottom,
          #cceafd,
          #b9dcf4
        );
    }


    .week-green td {
      background:
        linear-gradient(
          to bottom,
          #d5f4df,
          #c3efd3
        );
    }



    .week-label {
      font-size: 19px;

      font-weight: 900;

      white-space: nowrap;
    }



    .date {
      font-size: 19px;

      font-weight: 900;

      margin-bottom: 12px;

      color: #071c2e;

      position: relative;

      z-index: 3;
    }



    /* =========================================================
       ACTIVITY BUTTON
    ========================================================== */

    .activity-button {
      width: 92%;
      max-width: 180px;

      min-height: 74px;

      margin:
        0 auto;

      padding:
        9px 8px;

      border:
        1px solid #021b30;

      border-radius: 10px;

      background:
        linear-gradient(
          to bottom,
          #0b4f8a,
          #053765
        );

      color: white;

      font-size: 13px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 4px 0 #022440,
        0 6px 10px
        rgba(0,0,0,.20);

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      position: relative;

      z-index: 3;

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease;
    }


    .activity-button:hover {
      transform:
        translateY(-2px);

      background:
        linear-gradient(
          to bottom,
          #126db8,
          #074676
        );

      box-shadow:
        0 6px 0 #022440,
        0 8px 14px
        rgba(0,0,0,.24);
    }


    .activity-button:active {
      transform:
        translateY(2px);

      box-shadow:
        0 2px 0 #022440,
        0 3px 6px
        rgba(0,0,0,.18);
    }


    .button-icon {
      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex:
        0 0 52px;
    }


    .button-icon-image {
      display: block;
      width: 45px;
      height: 45px;
      object-fit: contain;
    }


    .button-label {
      line-height: 1.1;
    }



    /* =========================================================
       TODAY HIGHLIGHT
    ========================================================== */

    .calendar td.today-cell {
      background:
        linear-gradient(
          135deg,
          #fff8bf 0%,
          #ffe676 55%,
          #ffd84a 100%
        ) !important;

      box-shadow:
        inset 0 0 0 5px #ffc400,
        inset 0 0 25px
        rgba(255,196,0,.30);

      isolation: isolate;
    }


    .calendar td.today-cell::after {
      content: "";

      position: absolute;

      inset: 4px;

      border-radius: 4px;

      pointer-events: none;

      box-shadow:
        0 0 18px
        rgba(255,196,0,.55);

      z-index: 1;
    }


    .today-badge {
      position: absolute;

      top: 6px;
      right: 6px;

      padding:
        4px 9px;

      border:
        2px solid #8e6800;

      border-radius: 20px;

      background:
        linear-gradient(
          to bottom,
          #ffe36d,
          #ffc400
        );

      color: #071c2e;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: .7px;

      box-shadow:
        0 2px 5px
        rgba(0,0,0,.22);

      z-index: 5;
    }



    /* =========================================================
       CLOSED SIGN
    ========================================================== */

    .closed-sign-wrap {
      width: 82px;

      margin:
        -2px auto 0 auto;

      padding-top: 14px;

      position: relative;

      z-index: 3;
    }


    .closed-sign-hook {
      width: 6px;
      height: 6px;

      position: absolute;

      top: 0;
      left: 50%;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background: #334454;
    }


    .closed-wire-left,
    .closed-wire-right {
      width: 2px;
      height: 16px;

      position: absolute;

      top: 5px;
      left: 50%;

      background: #455563;

      transform-origin: top;
    }


    .closed-wire-left {
      transform:
        translateX(-1px)
        rotate(55deg);
    }


    .closed-wire-right {
      transform:
        translateX(-1px)
        rotate(-55deg);
    }


    .closed-sign {
      position: relative;

      z-index: 2;

      overflow: hidden;

      border:
        2px solid #152d40;

      border-radius: 6px;

      background:
        linear-gradient(
          to bottom,
          #ef343a,
          #be0c14
        );

      box-shadow:
        0 4px 7px
        rgba(0,0,0,.18);
    }


    .closed-sign-title {
      padding:
        5px 2px;

      color: white;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: .6px;

      text-shadow:
        0 1px 2px
        rgba(0,0,0,.25);
    }



    /* =========================================================
       LOADING / ERROR
    ========================================================== */

    .loading {
      padding: 40px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;
    }


    .error-box {
      padding: 25px;

      text-align: center;

      font-size: 16px;

      font-weight: 700;

      color: #9f1d1d;

      background: #fff0f0;
    }



    /* =========================================================
       POPUP
    ========================================================== */

    .modal-overlay {
      display: none;

      position: fixed;

      inset: 0;

      padding: 25px;

      align-items: center;

      justify-content: center;

      background:
        rgba(0,0,0,.70);

      z-index: 999999;
    }


    .modal-overlay.open {
      display: flex;
    }


    .modal {
      width:
        min(
          680px,
          94vw
        );

      max-height: 88vh;

      overflow: hidden;

      border:
        3px solid #d5dde4;

      border-radius: 18px;

      background: white;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);

      animation:
        popupIn .18s ease-out;
    }


    @keyframes popupIn {

      from {
        opacity: 0;

        transform:
          translateY(15px)
          scale(.97);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }



    .modal-header {
      position: relative;

      padding:
        20px 60px
        18px 24px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #052d50,
          #0b5798
        );

      border-bottom:
        5px solid #ffc72c;
    }


    .modal-title {
      margin: 0;

      font-size: 27px;

      font-weight: 900;

      line-height: 1.15;
    }


    .modal-date {
      margin-top: 5px;

      color: #ffc72c;

      font-size: 19px;

      font-weight: 900;
    }


    .modal-close {
      position: absolute;

      top: 9px;
      right: 16px;

      border: none;

      background: transparent;

      color: white;

      font-size: 38px;

      font-weight: 700;

      cursor: pointer;
    }



    .modal-body {
      padding: 25px;

      overflow-y: auto;

      max-height:
        calc(
          88vh - 120px
        );
    }


    .modal-content {
      color: #1c2c3a;

      font-size: 17px;

      line-height: 1.6;
    }



    /* =========================================================
       POPUP SECTION HEADINGS
    ========================================================== */

    .agenda-section-heading {
      margin:
        5px 0 15px 0;

      padding:
        8px 10px;

      color: #073b68;

      font-size: 19px;

      font-weight: 900;

      line-height: 1.25;

      border-left:
        5px solid #ffc72c;

      background:
        linear-gradient(
          to right,
          #fff4bf,
          #ffffff
        );

      border-radius:
        4px 8px 8px 4px;
    }


    .agenda-section-heading:not(:first-child) {
      margin-top: 24px;
    }



    /* =========================================================
       BEFORE YOU LEAVE
    ========================================================== */

    .agenda-section-heading.before-you-leave {
      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #073b68,
          #0b5798
        );

      border-left:
        5px solid #ffc72c;

      border-bottom:
        3px solid #ffc72c;

      padding:
        9px 12px;

      border-radius:
        5px 9px 9px 5px;

      box-shadow:
        0 3px 8px
        rgba(0,0,0,.16);
    }



    /* =========================================================
       POPUP CHECKLIST
    ========================================================== */

    .agenda-list {
      margin: 0;

      padding: 0;

      list-style: none;
    }


    .agenda-item {
      position: relative;

      margin:
        0 0 14px 0;

      padding-left: 32px;

      line-height: 1.5;
    }


    .agenda-item:last-child {
      margin-bottom: 0;
    }


    .agenda-item::before {
      content: "✓";

      position: absolute;

      left: 0;
      top: 2px;

      width: 21px;
      height: 21px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background: #ffc72c;

      color: #052d50;

      font-size: 13px;

      font-weight: 900;

      box-shadow:
        0 1px 3px
        rgba(0,0,0,.18);
    }


    .agenda-paragraph {
      margin: 0;

      line-height: 1.6;
    }



    /* =========================================================
       LINKS
    ========================================================== */

    .agenda-link {
      color: #075ea7;

      font-weight: 800;

      text-decoration: underline;

      text-decoration-thickness: 2px;

      text-underline-offset: 2px;

      cursor: pointer;
    }


    .agenda-link:hover {
      color: #003d70;
    }


    .agenda-link:focus {
      outline:
        3px solid #ffc72c;

      outline-offset: 3px;

      border-radius: 2px;
    }



    /* =========================================================
       SMALLER SCREENS
    ========================================================== */

    @media (max-width: 900px) {

      .page-frame {
        width:
          calc(
            100vw - 10px
          );

        margin-top: 5px;
      }


      .calendar-shell {
        overflow-x: auto;
      }


      .calendar {
        min-width: 820px;
      }


      .shop-header img {
        border-radius: 10px;
      }

    }

  </style>

</head>



<body>


<div class="page-frame">


  <header class="shop-header">

    <img
      src="shopschedule.png?v=3"
      alt="RMCTC Auto Tech Shop Schedule"
    >

  </header>



  <div class="calendar-shell">

    <div id="calendarArea">

      <div class="loading">
        Loading shop schedule...
      </div>

    </div>

  </div>


</div>



<!-- =========================================================
     POPUP
========================================================== -->

<div
  id="modalOverlay"
  class="modal-overlay"
>

  <div class="modal">


    <div class="modal-header">


      <button
        id="modalClose"
        class="modal-close"
        aria-label="Close popup"
      >
        ×
      </button>


      <h2
        id="modalTitle"
        class="modal-title"
      ></h2>


      <div
        id="modalDate"
        class="modal-date"
      ></div>


    </div>



    <div class="modal-body">

      <div
        id="modalContent"
        class="modal-content"
      ></div>

    </div>


  </div>

</div>



<script>


/* =========================================================
   GOOGLE SHEET
========================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQRZ071dUf8OcCEjIQe8g5dMWafYYBolUTy2Y-IPP8uyGZPJn_rjgkBjrjSTNXH0CmAeMSgd_5z23hy/pub?gid=0&single=true&output=csv&cb=" +
Date.now();


const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday"
];



/* =========================================================
   HEADER CLEANUP
========================================================== */

function normalizeHeader(header) {

  return String(header || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");

}



/* =========================================================
   LOAD GOOGLE SHEET
========================================================== */

Papa.parse(
  SHEET_URL,
  {

    download: true,

    header: true,

    skipEmptyLines: true,


    transformHeader:
      function(header) {

        return normalizeHeader(
          header
        );

      },


    complete:
      function(results) {

        buildCalendar(
          results.data
        );

      },


    error:
      function(error) {

        console.error(
          error
        );


        document
          .getElementById(
            "calendarArea"
          )
          .innerHTML =

          "<div class='error-box'>Unable to load the Google Sheet.</div>";

      }

  }
);



/* =========================================================
   BUILD CALENDAR
========================================================== */

function getButtonIcon(iconName) {

  const icons = {
    orientation: { type: "image", value: "icons/orientation.png" },
    instruction: { type: "image", value: "icons/instruction.png" },
    safety: { type: "image", value: "icons/safety.png" },
    shop: { type: "image", value: "icons/shop.png" },
    diagnostic: { type: "image", value: "icons/diagnostic.png" },
    assessment: { type: "image", value: "icons/assessment.png" },
    maintenance: { type: "image", value: "icons/maintenance.png" }
  };

  const key =
    String(iconName || "")
      .trim()
      .toLowerCase();

  return icons[key] || icons.shop;

}


function renderButtonIcon(iconName) {

  const icon =
    getButtonIcon(iconName);

  return `
    <img
      src="${escapeHTML(icon.value)}"
      alt=""
      class="button-icon-image"
    >
  `;

}


function buildCalendar(data) {


  const weeks = {};

  const popupData = {};



  data.forEach(
    row => {


      const week =
        String(
          row["WEEK"] ||
          row["WEEK #"] ||
          ""
        )
        .trim();



      const date =
        String(
          row["DATE"] ||
          ""
        )
        .trim();



      const day =
        String(
          row["DAY"] ||
          ""
        )
        .trim();



      const buttonText =
        String(
          row["BUTTON TEXT"] ||
          ""
        )
        .trim();



      /*
        Read ICON by header first.
        Object.values(row)[4] is a fallback for the fifth CSV column
        in case Google's published header metadata is stale.
      */
      const icon =
        String(
          row["ICON"] ||
          Object.values(row)[4] ||
          ""
        )
        .trim()
        .toLowerCase();


      const popupTitle =
        String(
          row["POPUP TITLE (AGENDA)"] ||
          row["POPUP TITLE"] ||
          Object.values(row)[5] ||
          ""
        )
        .trim();



      const popupContent =
        String(
          row["POPUP CONTENT"] ||
          Object.values(row)[6] ||
          ""
        )
        .trim();



      if (
        !week ||
        !day
      ) {

        return;

      }



      const normalizedDay =
        normalizeDay(
          day
        );



      if (
        !normalizedDay
      ) {

        return;

      }



      if (
        !weeks[week]
      ) {

        weeks[week] = {};

      }



      weeks[week][
        normalizedDay
      ] = {

        week,

        date,

        day:
          normalizedDay,

        buttonText,

        icon,

        popupTitle,

        popupContent

      };


    }
  );



  const weekNumbers =

    Object
      .keys(weeks)
      .sort(
        (a, b) =>
          Number(a)
          -
          Number(b)
      );



  if (
    weekNumbers.length === 0
  ) {

    document
      .getElementById(
        "calendarArea"
      )
      .innerHTML = `

        <div class="error-box">

          The Google Sheet loaded,
          but no schedule rows were found.

        </div>

      `;

    return;

  }



  let html = `

    <table class="calendar">

      <thead>

        <tr>

          <th class="week-column">
            Week #
          </th>

          <th>Monday</th>

          <th>Tuesday</th>

          <th>Wednesday</th>

          <th>Thursday</th>

          <th>Friday</th>

        </tr>

      </thead>


      <tbody>

  `;



  weekNumbers.forEach(
    (weekNumber, index) => {


      const colorClass =

        index % 2 === 0

          ? "week-blue"

          : "week-green";



      html += `

        <tr
          class="
            week-row
            ${colorClass}
          "
        >

          <td>

            <div class="week-label">

              Week ${escapeHTML(
                weekNumber
              )}

            </div>

          </td>

      `;



      DAYS.forEach(
        day => {


          const item =
            weeks[
              weekNumber
            ][day];



          if (
            !item
          ) {

            html +=
              "<td></td>";

            return;

          }



          const isToday =
            dateIsToday(
              item.date
            );



          html += `

            <td
              class="${
                isToday
                  ? "today-cell"
                  : ""
              }"
            >

          `;



          if (
            isToday
          ) {

            html += `

              <div class="today-badge">

                TODAY

              </div>

            `;

          }



          html += `

            <div class="date">

              ${escapeHTML(
                item.date
              )}

            </div>

          `;



          /* =================================================
             CLOSED DAY
          ================================================== */

          if (

            item.buttonText
              .trim()
              .toUpperCase()

            === "CLOSED"

          ) {


            html += `

              <div class="closed-sign-wrap">


                <div class="closed-sign-hook">
                </div>


                <div class="closed-wire-left">
                </div>


                <div class="closed-wire-right">
                </div>


                <div class="closed-sign">

                  <div class="closed-sign-title">

                    CLOSED

                  </div>

                </div>


              </div>

            `;


            html +=
              "</td>";


            return;

          }



          /* =================================================
             NORMAL DAY
          ================================================== */


          const popupId =

            `popup-${weekNumber}-${day}`

              .replace(
                /\s+/g,
                "-"
              )

              .toLowerCase();



          popupData[
            popupId
          ] = {


            title:

              item.popupTitle

              ||

              "Today's Agenda",



            date:

              item.date,



            content:

              item.popupContent

              ||

              "No agenda has been posted yet."

          };



          if (
            item.buttonText
          ) {


            html += `

              <button
                class="activity-button popup-trigger"
                data-popup-id="${escapeHTML(
                  popupId
                )}"
              >


                <span class="button-icon">
                  ${renderButtonIcon(item.icon)}
                </span>


                <span class="button-label">

                  ${escapeHTML(
                    item.buttonText
                  )}

                </span>


              </button>

            `;

          }



          html +=
            "</td>";


        }
      );



      html +=
        "</tr>";


    }
  );



  html += `

      </tbody>

    </table>

  `;



  document
    .getElementById(
      "calendarArea"
    )
    .innerHTML =
    html;



  /* =========================================================
     CONNECT POPUP BUTTONS
  ========================================================== */

  document
    .querySelectorAll(
      ".popup-trigger"
    )
    .forEach(
      button => {


        button
          .addEventListener(
            "click",
            function() {


              const popupId =
                this.dataset
                  .popupId
                  .trim();


              const popup =

                popupData[
                  popupId
                ];



              if (
                popup
              ) {

                openModal(
                  popup
                );

              }


            }
          );


      }
    );


}



/* =========================================================
   TODAY CHECK
========================================================== */

function dateIsToday(
  dateString
) {


  if (
    !dateString
  ) {

    return false;

  }



  const cleanedDate =
    String(
      dateString
    )
      .trim()
      .replace(
        /-/g,
        "/"
      );



  const parts =
    cleanedDate
      .split("/");



  if (
    parts.length !== 3
  ) {

    return false;

  }



  const month =
    Number(
      parts[0]
    );


  const day =
    Number(
      parts[1]
    );


  let year =
    Number(
      parts[2]
    );



  if (
    !month ||
    !day ||
    !year
  ) {

    return false;

  }



  if (
    year < 100
  ) {

    year += 2000;

  }



  const today =
    new Date();



  return (

    today
      .getFullYear()

    === year


    &&


    today
      .getMonth()
      + 1

    === month


    &&


    today
      .getDate()

    === day

  );


}



/* =========================================================
   DAY NAME CLEANUP
========================================================== */

function normalizeDay(day) {


  const value =

    String(
      day || ""
    )

      .trim()

      .toLowerCase();



  if (
    value === "monday" ||
    value === "mon"
  ) {

    return "Monday";

  }



  if (
    value === "tuesday" ||
    value === "tue" ||
    value === "tues"
  ) {

    return "Tuesday";

  }



  if (
    value === "wednesday" ||
    value === "wed"
  ) {

    return "Wednesday";

  }



  if (
    value === "thursday" ||
    value === "thu" ||
    value === "thur" ||
    value === "thurs"
  ) {

    return "Thursday";

  }



  if (
    value === "friday" ||
    value === "fri"
  ) {

    return "Friday";

  }



  return "";

}



/* =========================================================
   LINK FORMATTER
========================================================== */

function appendFormattedText(container, text) {

  const source = String(text || "");

  /*
    Supported formatting:

    Markdown links:
    [Google](https://google.com)

    Agenda Manager colors:
    [color=#c62828]Red text[/color]
  */

  const tokenPattern =
    /\[color=(#[0-9A-Fa-f]{6})\]([\s\S]*?)\[\/color\]|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;

  let lastIndex = 0;
  let match;


  while (
    (match = tokenPattern.exec(source)) !== null
  ) {

    if (match.index > lastIndex) {

      container.appendChild(
        document.createTextNode(
          source.slice(
            lastIndex,
            match.index
          )
        )
      );

    }


    if (match[1] && match[2] !== undefined) {

      const span =
        document.createElement("span");

      span.style.color =
        match[1];

      span.textContent =
        match[2];

      container.appendChild(
        span
      );

    }


    else if (match[3] && match[4]) {

      const link =
        document.createElement("a");

      link.className =
        "agenda-link";

      link.textContent =
        match[3];

      link.href =
        match[4];

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      container.appendChild(
        link
      );

    }


    lastIndex =
      tokenPattern.lastIndex;

  }


  if (lastIndex < source.length) {

    container.appendChild(
      document.createTextNode(
        source.slice(lastIndex)
      )
    );

  }

}


/* =========================================================
   SECTION HEADING CHECK
========================================================== */

function isAgendaHeading(line) {


  const value =
    String(
      line || ""
    )
      .trim();



  if (
    /^(🔧|🎯|📋|📌|⚙️|🧰|📚|✅)/u
      .test(
        value
      )
  ) {

    return true;

  }



  const normalized =
    value
      .replace(
        /[^A-Za-z0-9' ]/g,
        ""
      )
      .trim()
      .toUpperCase();



  const knownHeadings = [

    "TODAY'S FOCUS",

    "TODAYS FOCUS",

    "TODAY'S OBJECTIVE",

    "TODAY'S OBJECTIVES",

    "TODAYS OBJECTIVE",

    "TODAYS OBJECTIVES",

    "OBJECTIVES",

    "TODAY'S AGENDA",

    "TODAYS AGENDA",

    "BEFORE YOU LEAVE"

  ];



  return (
    knownHeadings
      .includes(
        normalized
      )
  );


}



/* =========================================================
   OPEN POPUP
========================================================== */

function openModal(data) {


  document
    .getElementById(
      "modalTitle"
    )
    .textContent =

      data.title

      ||

      "Today's Agenda";



  document
    .getElementById(
      "modalDate"
    )
    .textContent =

      data.date

      ||

      "";



  const contentArea =

    document
      .getElementById(
        "modalContent"
      );



  contentArea.innerHTML =
    "";



  const rawContent =

    String(

      data.content

      ||

      "No agenda has been posted yet."

    );



  const agendaLines =

    rawContent

      .split(
        /\r?\n/
      )

      .map(
        line =>
          line.trim()
      )

      .filter(
        line =>
          line.length > 0
      );



  if (
    agendaLines.length
    <= 1
  ) {


    const paragraph =

      document
        .createElement(
          "p"
        );


    paragraph.className =
      "agenda-paragraph";


    appendFormattedText(

      paragraph,

      agendaLines[0]

      ||

      "No agenda has been posted yet."

    );


    contentArea
      .appendChild(
        paragraph
      );


  }



  else {


    let currentList =
      null;



    agendaLines
      .forEach(
        line => {



          const cleanedLine =

            line.replace(
              /^[-•*]\s*/,
              ""
            );



          /* =============================================
             SECTION HEADING
          ============================================== */

          if (
            isAgendaHeading(
              cleanedLine
            )
          ) {


            currentList =
              null;



            const heading =

              document
                .createElement(
                  "div"
                );


            heading.className =
              "agenda-section-heading";


            /* =============================================
               SPECIAL BEFORE YOU LEAVE STYLE
            ============================================== */

            if (
              cleanedLine
                .trim()
                .startsWith(
                  "📌"
                )
            ) {

              heading
                .classList
                .add(
                  "before-you-leave"
                );

            }



            appendFormattedText(
              heading,
              cleanedLine
            );


            contentArea
              .appendChild(
                heading
              );


            return;

          }



          /* =============================================
             CREATE CHECKLIST
          ============================================== */

          if (
            !currentList
          ) {


            currentList =

              document
                .createElement(
                  "ul"
                );


            currentList.className =
              "agenda-list";


            contentArea
              .appendChild(
                currentList
              );

          }



          /* =============================================
             NORMAL CHECKLIST ITEM
          ============================================== */

          const item =

            document
              .createElement(
                "li"
              );


          item.className =
            "agenda-item";


          appendFormattedText(
            item,
            cleanedLine
          );


          currentList
            .appendChild(
              item
            );


        }
      );


  }



  document
    .getElementById(
      "modalOverlay"
    )
    .classList
    .add(
      "open"
    );



  document
    .body
    .style
    .overflow =

      "hidden";


}



/* =========================================================
   CLOSE POPUP
========================================================== */

function closeModal() {


  document
    .getElementById(
      "modalOverlay"
    )
    .classList
    .remove(
      "open"
    );



  document
    .body
    .style
    .overflow =

      "";


}



document
  .getElementById(
    "modalClose"
  )
  .addEventListener(
    "click",
    closeModal
  );



document
  .getElementById(
    "modalOverlay"
  )
  .addEventListener(
    "click",
    function(event) {


      if (

        event.target.id

        ===

        "modalOverlay"

      ) {

        closeModal();

      }


    }
  );



document
  .addEventListener(
    "keydown",
    function(event) {


      if (
        event.key ===
        "Escape"
      ) {

        closeModal();

      }


    }
  );



/* =========================================================
   SAFE TEXT
========================================================== */

function escapeHTML(value) {


  return String(
    value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );


}
