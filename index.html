<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop Schedule</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #073b68;
      --navy-dark: #052a4a;
      --blue-row: #b9dcf4;
      --green-row: #c3efd3;
      --yellow: #ffc72c;
      --text: #0a1e31;
    }

    body {
      margin: 0;
      background: #f3f5f7;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .site-shell {
      max-width: 1540px;
      margin: 0 auto;
      padding: 10px;
    }

    .shop-header {
      width: 100%;
      margin: 0 0 14px 0;
    }

    .shop-header img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,.22);
    }

    .calendar-shell {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #6e8194;
      box-shadow: 0 6px 18px rgba(0,0,0,.13);
    }

    .calendar {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .calendar th,
    .calendar td {
      border: 1px solid #3c5063;
      text-align: center;
    }

    .calendar thead th {
      background:
        linear-gradient(
          to bottom,
          #ffe467,
          #ffc72c
        );

      color: #111;
      font-size: 24px;
      font-weight: 900;
      padding: 14px 8px;
    }

    .week-column {
      width: 145px;
    }

    .week-row td {
      height: 175px;
      padding: 12px;
      vertical-align: middle;
    }

    .week-blue td {
      background:
        linear-gradient(
          to bottom,
          #cceafd,
          var(--blue-row)
        );
    }

    .week-green td {
      background:
        linear-gradient(
          to bottom,
          #d5f4df,
          var(--green-row)
        );
    }

    .week-label {
      font-size: 26px;
      font-weight: 900;
    }

    .date {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 15px;
      color: #071c2e;
    }

    .activity-button {
      width: 92%;
      max-width: 245px;
      margin: 0 auto;

      border: 1px solid #021b30;
      border-radius: 12px;

      padding: 15px 14px;

      background:
        linear-gradient(
          to bottom,
          #0b4f8a,
          #053765
        );

      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;

      box-shadow:
        0 5px 0 #022440,
        0 8px 14px rgba(0,0,0,.20);

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .activity-button:hover {
      transform: translateY(-2px);

      background:
        linear-gradient(
          to bottom,
          #126db8,
          #074676
        );

      box-shadow:
        0 7px 0 #022440,
        0 10px 18px rgba(0,0,0,.24);
    }

    .activity-button:active {
      transform: translateY(2px);

      box-shadow:
        0 2px 0 #022440,
        0 4px 8px rgba(0,0,0,.18);
    }

    .button-icon {
      color: var(--yellow);
      font-size: 24px;
      flex: 0 0 auto;
    }

    .button-label {
      line-height: 1.2;
    }

    .loading {
      padding: 50px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
    }

    .error-box {
      padding: 30px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #9f1d1d;
      background: #fff0f0;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 999999;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: min(760px, 95vw);
      max-height: 88vh;
      overflow: hidden;
      border-radius: 18px;
      background: white;
      border: 3px solid #d5dde4;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      animation: popupIn .18s ease-out;
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      background:
        linear-gradient(
          135deg,
          #052d50,
          #0b5798
        );

      color: white;
      padding: 22px 65px 20px 26px;
      position: relative;
      border-bottom: 5px solid var(--yellow);
    }

    .modal-title {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
    }

    .modal-date {
      margin-top: 5px;
      color: var(--yellow);
      font-size: 21px;
      font-weight: 900;
    }

    .modal-close {
      position: absolute;
      right: 18px;
      top: 11px;
      border: none;
      background: transparent;
      color: white;
      font-size: 40px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-body {
      padding: 28px;
      overflow-y: auto;
      max-height: calc(88vh - 125px);
    }

    .agenda-heading {
      color: var(--navy);
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .modal-content {
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #1c2c3a;
    }

    @media (max-width: 950px) {
      .site-shell {
        padding: 5px;
      }

      .shop-header img {
        border-radius: 10px;
      }

      .calendar-shell {
        overflow-x: auto;
        border-radius: 10px;
      }

      .calendar {
        min-width: 900px;
      }
    }
  </style>
</head>

<body>

<div class="site-shell">

  <header class="shop-header">
    <img
      src="shopschedule.png"
      alt="RMCTC Auto Tech Shop Schedule"
    >
  </header>

  <div class="calendar-shell">
    <div id="calendarArea">
      <div class="loading">
        Loading shop schedule...
      </div>
    </div>
  </div>

</div>

<div id="modalOverlay" class="modal-overlay">

  <div class="modal">

    <div class="modal-header">

      <button
        id="modalClose"
        class="modal-close"
        aria-label="Close popup"
      >
        ×
      </button>

      <h2
        id="modalTitle"
        class="modal-title"
      ></h2>

      <div
        id="modalDate"
        class="modal-date"
      ></div>

    </div>

    <div class="modal-body">

      <div class="agenda-heading">
        🔧 Today's Agenda
      </div>

      <div
        id="modalContent"
        class="modal-content"
      ></div>

    </div>

  </div>

</div>

<script>

/* =========================================================
   GOOGLE SHEET FEED
========================================================= */

const BASE_SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQRZ071dUf8OcCEjIQe8g5dMWafYYBolUTy2Y-IPP8uyGZPJn_rjgkBjrjSTNXH0CmAeMSgd_5z23hy/pub?gid=0&single=true&output=csv";

/*
  Cache-buster:
  forces the browser to request a fresh copy of the published sheet.
*/
const SHEET_URL =
  BASE_SHEET_URL + "&cb=" + Date.now();


const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday"
];


/* =========================================================
   NORMALIZE HEADER NAMES
========================================================= */

function normalizeHeader(header) {

  return String(header || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");

}


/* =========================================================
   LOAD SHEET
========================================================= */

Papa.parse(SHEET_URL, {

  download: true,

  header: true,

  skipEmptyLines: true,

  transformHeader: function(header) {
    return normalizeHeader(header);
  },

  complete: function(results) {

    console.log("RAW SHEET DATA:", results.data);

    buildCalendar(results.data);

  },

  error: function(error) {

    console.error(error);

    document.getElementById("calendarArea").innerHTML =
      "<div class='error-box'>Unable to load the Google Sheet.</div>";

  }

});


/* =========================================================
   BUILD CALENDAR
========================================================= */

function buildCalendar(data) {

  const weeks = {};
  const popupData = {};


  data.forEach(row => {

    const week =
      String(
        row["WEEK"] ||
        row["WEEK #"] ||
        ""
      ).trim();


    const date =
      String(
        row["DATE"] ||
        ""
      ).trim();


    const day =
      String(
        row["DAY"] ||
        ""
      ).trim();


    const buttonText =
      String(
        row["BUTTON TEXT"] ||
        ""
      ).trim();


    const popupTitle =
      String(
        row["POPUP TITLE (AGENDA)"] ||
        row["POPUP TITLE"] ||
        ""
      ).trim();


    const popupContent =
      String(
        row["POPUP CONTENT"] ||
        ""
      ).trim();


    if (!week || !day) {
      return;
    }


    const normalizedDay =
      normalizeDay(day);


    if (!normalizedDay) {
      return;
    }


    if (!weeks[week]) {
      weeks[week] = {};
    }


    weeks[week][normalizedDay] = {
      week: week,
      date: date,
      day: normalizedDay,
      buttonText: buttonText,
      popupTitle: popupTitle,
      popupContent: popupContent
    };

  });


  const weekNumbers =
    Object.keys(weeks)
      .sort((a, b) => Number(a) - Number(b));


  if (weekNumbers.length === 0) {

    document.getElementById("calendarArea").innerHTML =
      `
        <div class="error-box">
          The Google Sheet loaded, but no schedule rows were found.
          Check that WEEK and DAY contain data.
        </div>
      `;

    return;
  }


  let html = `

    <table class="calendar">

      <thead>

        <tr>

          <th class="week-column">
            Week #
          </th>

          <th>Monday</th>

          <th>Tuesday</th>

          <th>Wednesday</th>

          <th>Thursday</th>

          <th>Friday</th>

        </tr>

      </thead>

      <tbody>

  `;


  weekNumbers.forEach((weekNumber, index) => {

    const colorClass =
      index % 2 === 0
        ? "week-blue"
        : "week-green";


    html += `

      <tr class="week-row ${colorClass}">

        <td>

          <div class="week-label">
            Week ${escapeHTML(weekNumber)}
          </div>

        </td>

    `;


    DAYS.forEach(day => {

      const item =
        weeks[weekNumber][day];


      if (!item) {

        html += "<td></td>";

        return;

      }


      const popupId =
        `popup-${weekNumber}-${day}`
          .replace(/\s+/g, "-")
          .toLowerCase();


      popupData[popupId] = {

        title:
          item.popupTitle ||
          "Today's Agenda",

        date:
          item.date,

        content:
          item.popupContent ||
          "No agenda has been posted yet."

      };


      html += `

        <td>

          <div class="date">
            ${escapeHTML(item.date)}
          </div>

      `;


      if (item.buttonText) {

        html += `

          <button
            class="activity-button popup-trigger"
            data-popup-id="${escapeHTML(popupId)}"
          >

            <span class="button-icon">
              🔧
            </span>

            <span class="button-label">
              ${escapeHTML(item.buttonText)}
            </span>

          </button>

        `;

      }


      html += `

        </td>

      `;

    });


    html += `

      </tr>

    `;

  });


  html += `

      </tbody>

    </table>

  `;


  document.getElementById("calendarArea").innerHTML =
    html;


  document
    .querySelectorAll(".popup-trigger")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const popup =
            popupData[this.dataset.popupId];


          if (popup) {
            openModal(popup);
          }

        }
      );

    });

}


/* =========================================================
   NORMALIZE DAY
========================================================= */

function normalizeDay(day) {

  const value =
    String(day || "")
      .trim()
      .toLowerCase();


  if (value === "monday" || value === "mon") {
    return "Monday";
  }

  if (value === "tuesday" || value === "tue" || value === "tues") {
    return "Tuesday";
  }

  if (value === "wednesday" || value === "wed") {
    return "Wednesday";
  }

  if (value === "thursday" || value === "thu" || value === "thur" || value === "thurs") {
    return "Thursday";
  }

  if (value === "friday" || value === "fri") {
    return "Friday";
  }

  return "";

}


/* =========================================================
   POPUP
========================================================= */

function openModal(data) {

  document.getElementById("modalTitle").textContent =
    data.title || "Today's Agenda";


  document.getElementById("modalDate").textContent =
    data.date || "";


  document.getElementById("modalContent").textContent =
    data.content || "No agenda has been posted yet.";


  document
    .getElementById("modalOverlay")
    .classList.add("open");


  document.body.style.overflow =
    "hidden";

}


function closeModal() {

  document
    .getElementById("modalOverlay")
    .classList.remove("open");


  document.body.style.overflow =
    "";

}


document
  .getElementById("modalClose")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("modalOverlay")
  .addEventListener(
    "click",
    function(event) {

      if (event.target.id === "modalOverlay") {
        closeModal();
      }

    }
  );


document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {
      closeModal();
    }

  }
);


/* =========================================================
   SAFE TEXT
========================================================= */

function escapeHTML(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
